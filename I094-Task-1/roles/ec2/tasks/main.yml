# ---------------------------------------------------------
# Create EC2 Instance 1
# ---------------------------------------------------------

- name: Create EC2 Instance 1
  amazon.aws.ec2_instance:
    name: nginx-server-1

    region: "{{ region }}"

    key_name: "{{ key_name }}"

    instance_type: "{{ instance_type }}"

    image_id: "{{ ami_id }}"

    wait: true

    exact_count: 1

    vpc_subnet_id: "{{ private_subnet_1 }}"

    security_groups:
      - "{{ ec2_sg.group_id | default(ec2_sg.security_group.group_id) }}"

    network:
      assign_public_ip: false

    tags: "{{ resource_tags }}"

  register: ec2_instance_1


# ---------------------------------------------------------
# Create EC2 Instance 2
# ---------------------------------------------------------

- name: Create EC2 Instance 2
  amazon.aws.ec2_instance:
    name: nginx-server-2

    region: "{{ region }}"

    key_name: "{{ key_name }}"

    instance_type: "{{ instance_type }}"

    image_id: "{{ ami_id }}"

    wait: true

    exact_count: 1

    vpc_subnet_id: "{{ private_subnet_2 }}"

    security_groups:
      - "{{ ec2_sg.group_id | default(ec2_sg.security_group.group_id) }}"

    network:
      assign_public_ip: false

    tags: "{{ resource_tags }}"

  register: ec2_instance_2


# ---------------------------------------------------------
# Display EC2 Instance IDs
# ---------------------------------------------------------

- name: Show EC2 Instance 1 ID
  debug:
    var: ec2_instance_1.instance_ids


- name: Show EC2 Instance 2 ID
  debug:
    var: ec2_instance_2.instance_ids


# ---------------------------------------------------------
# Add EC2 Instance 1 To Dynamic Inventory
# ---------------------------------------------------------

- name: Add EC2 Instance 1 to inventory
  add_host:
    hostname: "{{ ec2_instance_1.instances[0].private_ip_address }}"
    groupname: web
    ansible_user: ec2-user
    ansible_ssh_private_key_file: praveen-tasks.pem


# ---------------------------------------------------------
# Add EC2 Instance 2 To Dynamic Inventory
# ---------------------------------------------------------

- name: Add EC2 Instance 2 to inventory
  add_host:
