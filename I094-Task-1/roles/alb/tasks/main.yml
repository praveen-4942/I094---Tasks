- name: Create Application Load Balancer
  amazon.aws.elb_application_lb:
    name: nginx-alb
    state: present
    region: "{{ region }}"

    security_groups:
      - "{{ alb_sg.group_id | default(alb_sg.security_group.group_id) }}"

    subnets:
      - "{{ public_subnet_1 }}"
      - "{{ public_subnet_2 }}"

    scheme: internet-facing

    listeners:
      - Protocol: HTTP
        Port: 80
        DefaultActions:
          - Type: forward
            TargetGroupName: nginx-target-group

    tags: "{{ resource_tags }}"

  register: alb
